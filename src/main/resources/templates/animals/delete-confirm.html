<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Eliminar Animal</title>
</head>
<body>
<div style="background-color: #007bff; color: white; padding: 15px; font-size: 20px; font-weight: bold;">Animalia</div>

<h1>¿Realmente desea eliminar este animal?</h1>
<ul>
  <li>Id: <span th:text="${animal.id}"></span></li>
  <li>Nombre: <span th:text="${animal.nombre}"></span></li>
  <li>Vida Media: <span th:text="${animal.vidaMedia}"></span></li>
  <li>Extinto: <span th:text="${animal.extinto ? 'Sí' : 'No'}"></span></li>
</ul>

<form th:action="@{/animals/{id}/delete(id=${animal.id})}" method="post">
  <button type="submit">Sí, eliminar</button>
</form>
<br>
<a th:href="@{/animals}">Cancelar</a>
</body>
</html>
